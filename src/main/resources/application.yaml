spring:
  application:
    name: r_board
  #application.yaml 파일에 다음을 추가

  #데이터베이스 연결 정보
  datasource:
    driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mariadb://localhost:3306/study_db
    username: study_user
    password: mariadb

#쿼리문이 있는 mapper 파일 위치 지정, classpath는 resources 폴더를 의미함
mybatis:
  mapper-locations: classpath:mapper/*.xml